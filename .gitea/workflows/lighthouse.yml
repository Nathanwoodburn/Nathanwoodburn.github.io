name: Lighthouse Audit
run-name: Lighthouse CI
on:
  push:

jobs:
  Lighthouse:
    runs-on: [ubuntu-latest, amd]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Chrome
        run: |
          if ! command -v google-chrome-stable &> /dev/null && ! command -v google-chrome &> /dev/null; then
            apt-get update
            apt-get install -y wget curl fonts-liberation libu2f-udev libvulkan1
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            apt-get install -y ./google-chrome-stable_current_amd64.deb
            rm -f google-chrome-stable_current_amd64.deb
          fi
          google-chrome-stable --version || google-chrome --version

      - name: Build and Start Site Container
        run: |
          docker build -t site:test .

          # Determine networking mode: if runner is in a container (act_runner), share network stack
          NET_MODE="-p 5000:5000"
          if docker inspect "$(hostname)" > /dev/null 2>&1; then
            echo "Runner is running in container $(hostname), attaching site container to runner network namespace."
            NET_MODE="--network container:$(hostname)"
          else
            echo "Runner is running on host, using host port mapping."
          fi

          docker run -d --name site-test $NET_MODE site:test
          echo "Waiting for site to start on port 5000..."
          READY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "Site is ready (HTTP 200)!"
              READY=1
              break
            fi
            echo "Waiting for site... (status: $STATUS)"
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Site container failed to respond in 30s. Docker logs:"
            docker logs site-test
            exit 1
          fi

      - name: Run Lighthouse CI
        run: |
          npx @lhci/cli autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Upload Lighthouse Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

      - name: Stop Site Container
        if: always()
        run: |
          docker rm -f site-test || true
