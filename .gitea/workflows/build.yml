name: Build Docker
run-name: Build Docker Images
on:
  push:

jobs:
  BuildImage:
    runs-on: [ubuntu-latest, amd]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name gitea-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push Docker image with caching
        run: |
          echo "${{ secrets.DOCKERGIT_TOKEN }}" | docker login git.woodburn.au -u nathanwoodburn --password-stdin
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          tag=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          tag=${tag//\//-}
          tag_num=${GITHUB_RUN_NUMBER}
          echo "tag_num=$tag_num"

          if [[ "$tag" == "main" ]]; then
            tag="latest"
          else
            tag_num="${tag}-${tag_num}"
          fi

          REGISTRY_IMAGE="git.woodburn.au/nathanwoodburn/nathanwoodburn"
          echo "Building and pushing tags: ${REGISTRY_IMAGE}:${tag_num} and ${REGISTRY_IMAGE}:${tag}"

          docker buildx build \
            --push \
            --tag "${REGISTRY_IMAGE}:${tag_num}" \
            --tag "${REGISTRY_IMAGE}:${tag}" \
            --cache-from "type=registry,ref=${REGISTRY_IMAGE}:buildcache" \
            --cache-from "type=registry,ref=${REGISTRY_IMAGE}:latest" \
            --cache-to "type=registry,ref=${REGISTRY_IMAGE}:buildcache,mode=max" \
            .
