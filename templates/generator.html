<!-- partial:index.partial -->
<div class="container">
        <h1 class="title">Password Generator</h1>
        <div class="result">
                <div class="result__title field-title">Generated Password</div>
                <div class="result__info right">click to copy</div>
                <div class="result__info left">copied</div>
                <div class="result__viewbox" id="result"><button class="textgenerate" id="textgenerate">GENERATE PASSWORD</button></div>
                <button id="copy-btn" aria-label="Copy password to clipboard" style="--x: 0; --y: 0"><svg class="bi bi-copy" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/></svg></button>
        </div>
        <div class="length range__slider" data-min="4" data-max="32">
                <div class="length__title field-title" data-length='0'>length:</div>
                <input id="slider" type="range" min="4" max="32" value="16" />
        </div>

        <div class="settings">
                <span class="settings__title field-title">settings</span>
                <div class="setting">
                        <input type="checkbox" id="uppercase" checked />
                        <label for="uppercase">Include Uppercase</label>
                </div>
                <div class="setting">
                        <input type="checkbox" id="lowercase" checked />
                        <label for="lowercase">Include Lowercase</label>
                </div>
                <div class="setting">
                        <input type="checkbox" id="number" checked />
                        <label for="number">Include Numbers</label>
                </div>
                <div class="setting">
                        <input type="checkbox" id="symbol" />
                        <label for="symbol">Include Symbols</label>
                </div>
        </div>

        <button class="btn generate" id="generate">Generate Password</button>
        <a href="https://nathan.woodburn.au/" target="_blank">Nathan.Woodburn/</a>
</div>
