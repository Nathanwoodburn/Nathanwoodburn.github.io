{# ==========================================================================
   Clock & Floating Spotify Widget
   ========================================================================== #}
<link rel="stylesheet" href="/assets/css/spotify-widget.css">

<div class="d-none d-print-none d-sm-none d-md-block d-lg-block d-xl-block d-xxl-block clock clock-widget">
    <svg class="fs-2" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M10 18C14.4183 18 18 14.4183 18 10C18 5.58172 14.4183 2 10 2C5.58172 2 2 5.58172 2 10C2 14.4183 5.58172 18 10 18ZM11 6C11 5.44772 10.5523 5 10 5C9.44771 5 9 5.44772 9 6V10C9 10.2652 9.10536 10.5196 9.29289 10.7071L12.1213 13.5355C12.5118 13.9261 13.145 13.9261 13.5355 13.5355C13.9261 13.145 13.9261 12.5118 13.5355 12.1213L11 9.58579V6Z" fill="currentColor"></path>
    </svg>
    <span class="clock-widget-time">{{ time | safe }}</span>
</div>

<!-- Pop-out button for mobile -->
<button id="spotify-toggle" aria-label="Toggle Spotify Player">
    <img src="/assets/img/external/spotify.png" alt="Spotify">
</button>

<div id="spotify-widget" aria-label="Spotify Player">
    <img id="spotify-album-art" src="" alt="Album Art">
    <div class="spotify-info">
        <div id="spotify-song"></div>
        <div id="spotify-artist"></div>
        <div id="spotify-album"></div>
        <!-- Progress Bar -->
        <div class="spotify-progress-container">
            <div id="spotify-progress"></div>
        </div>
    </div>
</div>

<script src="/assets/js/spotify-widget.js"></script>
