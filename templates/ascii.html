    <meta name="description" content="G'day, this is my personal website. You can find out about me or check out some of my projects.">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="{{ site_url }}/assets/img/profile.jpg">
    <meta property="og:image" content="{{ site_url }}/assets/img/profile.jpg">

    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/assets/img/apple-touch-icon.png">

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/android-chrome-512x512.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="me" href="https://mastodon.woodburn.au/@nathanwoodburn" />
    <script async src="https://umami.woodburn.au/script.js" data-website-id="6a55028e-aad3-481c-9a37-3e096ff75589"></script>
</head>

<body class="ascii-page">
    <div class="terminal-window">
        <div class="terminal-titlebar">
            <div class="terminal-dots">
                <span class="dot dot-close" aria-hidden="true"></span>
                <span class="dot dot-minimize" aria-hidden="true"></span>
                <span class="dot dot-maximize" aria-hidden="true"></span>
            </div>
            <div class="terminal-title">nathan@woodburn: ~/{{ filename or 'terminal.ascii' }}</div>
            <div class="terminal-actions">
                {% if web_link %}
                <a href="{{ web_link }}" class="term-btn" title="View standard web page">Web View</a>
                {% endif %}
                <a href="?raw=1" class="term-btn" title="View raw plain text">Raw</a>
                <button id="copy-btn" class="term-btn" type="button" title="Copy ASCII output">Copy</button>
            </div>
        </div>
        <div class="terminal-body">
            <pre class="terminal-pre"><code id="terminal-output">{{ ascii_art | safe }}</code></pre>
        </div>
    </div>
    <script>
        document.getElementById('copy-btn')?.addEventListener('click', function() {
            const code = document.getElementById('terminal-output');
            if (!code) return;
            navigator.clipboard.writeText(code.innerText).then(() => {
                const prev = this.innerText;
                this.innerText = 'Copied!';
                setTimeout(() => { this.innerText = prev; }, 2000);
            });
        });
    </script>
</body>

</html>
